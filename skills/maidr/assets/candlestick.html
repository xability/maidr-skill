<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACME monthly price</title>
    <!--
      Hand-authored candlestick. Use this when the plotting library on hand cannot draw
      candlesticks: two floating bar series look similar but bind as `dodged_bar`, which is
      what the reader would then be told. Drawing the marks yourself keeps the picture and
      the announcement the same chart.

      Loader chain: jsDelivr, then cdnjs, then a local copy. In a chat artifact a single
      CDN tag is enough, since the sandbox reads no local files.
    -->
    <script>
      (function () {
        var sources = [
          "https://cdn.jsdelivr.net/npm/maidr@4.6.0/dist/maidr.js",
          "https://cdnjs.cloudflare.com/ajax/libs/maidr/4.6.0/maidr.min.js",
          "./maidr.js"
        ];
        function load(i) {
          if (i >= sources.length) { console.error("maidr.js could not be loaded from any source"); return; }
          var s = document.createElement("script");
          s.src = sources[i];
          s.onerror = function () { load(i + 1); };
          document.head.appendChild(s);
        }
        load(0);
      })();
    </script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; background: #fff; }
      .up   { fill: #1b7f5a; stroke: #1b7f5a; }
      .down { fill: #b23b3b; stroke: #b23b3b; }
      .axis { stroke: #333; stroke-width: 1; }
      .grid { stroke: #e4e8ec; stroke-width: 1; }
      .tick, .axis-label { font-size: 12px; fill: #444; }
      .chart-title { font-size: 16px; font-weight: 600; fill: #111; }
      .legend { font-size: 12px; fill: #444; }
    </style>
  </head>
  <body>
    <h1>ACME monthly price</h1>
    <p>Tab to the chart, then use the arrow keys. B = braille, T = text, S = sound, R = review, Ctrl+/ = shortcut help.</p>

    <!--
      Candlestick data differs from every other type in one way worth checking twice:
      the date field is "value", NOT "x". Each point is
        { "value": <date or label>, "open": n, "high": n, "low": n, "close": n, "volume": n }
      with "volume" optional. Points run in drawn order, and `selectors` matches one group
      per point, so index k in the data is group k on the chart.

      Each candle here is one <g class="candle">: a wick line from low to high, plus a body
      rect spanning open..close. Price scale: 90..150 maps to y = 300..40 (4.333 px per unit),
      so y = 300 - (price - 90) * 4.3333.
    -->
    <svg xmlns="http://www.w3.org/2000/svg" id="acme" width="620" height="360" viewBox="0 0 620 360" role="img"
         aria-label="Candlestick chart of ACME monthly price, January to June"
         maidr='{
           "id": "acme",
           "title": "ACME monthly price",
           "subplots": [[{
             "layers": [{
               "id": "acme-candles",
               "type": "candlestick",
               "axes": { "x": { "label": "Month" }, "y": { "label": "Price (USD)" } },
               "selectors": "#acme g.candle",
               "data": [
                 { "value": "Jan", "open": 100, "high": 118, "low":  96, "close": 114 },
                 { "value": "Feb", "open": 114, "high": 126, "low": 108, "close": 110 },
                 { "value": "Mar", "open": 110, "high": 113, "low":  94, "close":  98 },
                 { "value": "Apr", "open":  98, "high": 122, "low":  95, "close": 120 },
                 { "value": "May", "open": 120, "high": 141, "low": 117, "close": 138 },
                 { "value": "Jun", "open": 138, "high": 146, "low": 124, "close": 129 }
               ]
             }]
           }]]
         }'>
      <text class="chart-title" x="310" y="26" text-anchor="middle">ACME monthly price</text>
      <!-- grid and y axis: 90, 105, 120, 135, 150 -->
      <line class="grid" x1="70" y1="300" x2="600" y2="300" />
      <line class="grid" x1="70" y1="235" x2="600" y2="235" />
      <line class="grid" x1="70" y1="170" x2="600" y2="170" />
      <line class="grid" x1="70" y1="105" x2="600" y2="105" />
      <line class="grid" x1="70" y1="40"  x2="600" y2="40" />
      <line class="axis" x1="70" y1="40" x2="70" y2="300" />
      <line class="axis" x1="70" y1="300" x2="600" y2="300" />
      <text class="tick" x="62" y="304" text-anchor="end">90</text>
      <text class="tick" x="62" y="239" text-anchor="end">105</text>
      <text class="tick" x="62" y="174" text-anchor="end">120</text>
      <text class="tick" x="62" y="109" text-anchor="end">135</text>
      <text class="tick" x="62" y="44"  text-anchor="end">150</text>

      <!-- one <g class="candle"> per data point, in data order -->
      <g class="candle"><line class="up"   x1="115" y1="256.7" x2="115" y2="178.7" stroke-width="1.5" /><rect class="up"   x="97"  y="178.7" width="36" height="60.7" /></g>
      <g class="candle"><line class="down" x1="200" y1="222.0" x2="200" y2="144.0" stroke-width="1.5" /><rect class="down" x="182" y="144.0" width="36" height="17.3" /></g>
      <g class="candle"><line class="down" x1="285" y1="317.3" x2="285" y2="217.7" stroke-width="1.5" /><rect class="down" x="267" y="213.3" width="36" height="52.0" /></g>
      <g class="candle"><line class="up"   x1="370" y1="278.3" x2="370" y2="161.3" stroke-width="1.5" /><rect class="up"   x="352" y="170.0" width="36" height="95.3" /></g>
      <g class="candle"><line class="up"   x1="455" y1="183.0" x2="455" y2="79.0"  stroke-width="1.5" /><rect class="up"   x="437" y="91.0"  width="36" height="78.0" /></g>
      <g class="candle"><line class="down" x1="540" y1="209.0" x2="540" y2="57.7"  stroke-width="1.5" /><rect class="down" x="522" y="57.7"  width="36" height="39.0" /></g>

      <text class="tick" x="115" y="320" text-anchor="middle">Jan</text>
      <text class="tick" x="200" y="320" text-anchor="middle">Feb</text>
      <text class="tick" x="285" y="320" text-anchor="middle">Mar</text>
      <text class="tick" x="370" y="320" text-anchor="middle">Apr</text>
      <text class="tick" x="455" y="320" text-anchor="middle">May</text>
      <text class="tick" x="540" y="320" text-anchor="middle">Jun</text>
      <text class="axis-label" x="335" y="344" text-anchor="middle">Month</text>
      <text class="axis-label" x="20" y="170" text-anchor="middle" transform="rotate(-90 20 170)">Price (USD)</text>
      <text class="legend" x="600" y="352" text-anchor="end">Green: close above open. Red: close below open.</text>
    </svg>
  </body>
</html>
