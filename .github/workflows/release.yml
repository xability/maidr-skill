name: release

# Cuts a release from `main` with semantic-release (.releaserc.json): the version comes from
# the Conventional Commits since the last `v*` tag, tools/set-version.py writes it into
# .claude-plugin/plugin.json, plugin.json and SKILL.md, and the release commit, the tag, the
# CHANGELOG.md entry and the GitHub release follow.
#
# The version is Claude Code's update signal: an installed copy updates only when it changes.
# So every commit that changes what an installed agent reads has to release, which is why
# .releaserc.json also releases docs(skill) and refactor(skill), and why update-bundle
# commits its refresh as fix(bundle).
#
# validate.yml calls this after its checks pass on `main`, whether a push or update-bundle's
# dispatch started it, so nothing is released from a red `main`.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Two green runs on `main` in a row must not release the same commits twice.
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tag the first version
        # semantic-release would start from 1.0.0. The manifests on `main` already say 0.1.0,
        # so tag that commit once; later releases count up from it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$(git tag --list 'v*')" ]; then exit 0; fi
          version=$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          git tag "v$version"
          git push origin "v$version"
          gh release create "v$version" --title "v$version" --notes "First versioned release."

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: xabilitylab
          GIT_AUTHOR_EMAIL: 187909674+xabilitylab@users.noreply.github.com
          GIT_COMMITTER_NAME: xabilitylab
          GIT_COMMITTER_EMAIL: 187909674+xabilitylab@users.noreply.github.com
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          semantic-release
