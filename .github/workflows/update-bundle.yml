name: update-bundle

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "maidr version to vendor (blank = latest on npm)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh vendored maidr.js
        id: refresh
        run: |
          bash tools/update-bundle.sh "${{ github.event.inputs.version }}" | tee update.log
          echo "version=$(python3 -c 'import json;print(json.load(open("skills/maidr/assets/maidr-bundle.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Open pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-maidr-bundle
          commit-message: "chore: vendor maidr.js ${{ steps.refresh.outputs.version }}"
          title: "chore: vendor maidr.js ${{ steps.refresh.outputs.version }}"
          body: |
            Automated refresh of the vendored maidr.js bundle and version pins.

            ```
            ${{ steps.refresh.outputs.version }}
            ```

            Review `skills/maidr/assets/maidr-bundle.json` for the new checksums, and check that the cdnjs
            fallback URL resolves (the update log warns when cdnjs has not mirrored the release yet).
          labels: dependencies
          delete-branch: true
