name: validate

on:
  push:
    branches: [main]
  pull_request:
  # update-bundle.yml starts this on main after it commits a refresh, since its
  # GITHUB_TOKEN push triggers nothing on its own.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Validate skill frontmatter (Agent Skills spec)
        run: uvx --from skills-ref agentskills validate skills/maidr

      - name: Manifests are valid JSON
        run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          python -m json.tool skills/maidr/assets/maidr-bundle.json > /dev/null
          python -m json.tool skills/maidr/assets/dotpad-sdk.json > /dev/null
          python -m json.tool evals/evals.json > /dev/null

      - name: Template passes the HTML checker
        run: python skills/maidr/scripts/check_maidr_html.py skills/maidr/assets/template.html

      - name: HTML checker regression tests
        # beautifulsoup4 so the selector checks run rather than skip
        run: uv run --no-project --with beautifulsoup4 python -m unittest discover -s tests -v

      - name: Environment detector prints valid JSON
        run: bash skills/maidr/scripts/detect_env.sh . | python -m json.tool > /dev/null

      - name: Vendored bundle matches recorded checksums and the npm release
        run: |
          python - <<'EOF'
          import hashlib, json, urllib.request
          meta = json.load(open("skills/maidr/assets/maidr-bundle.json"))
          ver = meta["version"]
          for name, info in meta["files"].items():
              local = open(f"skills/maidr/assets/{name}", "rb").read()
              digest = hashlib.sha256(local).hexdigest()
              assert digest == info["sha256"], f"{name}: recorded sha256 differs from file"
              remote = urllib.request.urlopen(f"https://cdn.jsdelivr.net/npm/maidr@{ver}/dist/{name}", timeout=30).read()
              assert hashlib.sha256(remote).hexdigest() == digest, f"{name}: differs from maidr@{ver} on npm"
          print(f"vendored maidr {ver} verified")
          EOF

      - name: DotPad SDK pin names every file with a size and digest
        run: |
          python - <<'EOF'
          import json, re
          meta = json.load(open("skills/maidr/assets/dotpad-sdk.json"))
          assert re.fullmatch(r"[0-9a-f]{40}", meta["commit"]), "commit is not a full sha"
          assert meta["baseUrl"].endswith(f"@{meta['commit']}/Web/{meta['version']}/"), "baseUrl does not pin the commit"
          # The files are served from `repository` (a GitHub repo) through jsDelivr's gh endpoint,
          # so baseUrl is a function of repository, commit and version; nothing else is hard-coded.
          repo = re.fullmatch(r"https://github\.com/([\w.-]+/[\w.-]+)", meta["repository"])
          assert repo, "repository is not a GitHub repository URL"
          assert meta["baseUrl"] == f"https://cdn.jsdelivr.net/gh/{repo.group(1)}@{meta['commit']}/Web/{meta['version']}/", "baseUrl does not serve the named repository"
          if "upstream" in meta:   # the vendor's release the served files were extracted from
              up = meta["upstream"]
              assert re.fullmatch(r"[0-9a-f]{40}", up["commit"]), "upstream commit is not a full sha"
              assert re.fullmatch(r"[0-9a-f]{64}", up["sha256"]), "upstream archive sha256 is malformed"
              assert up["archive"].endswith(".zip"), "upstream archive is not the vendor's zip"
          assert meta["module"] in meta["files"], "the SDK module is not listed"
          for name in ("liblouis.js", "liblouis.wasm", "liblouis.data"):
              assert meta["assetDir"] + name in meta["files"], f"{name} is not listed"
          for name, info in meta["files"].items():
              assert info["bytes"] > 0 and re.fullmatch(r"[0-9a-f]{64}", info["sha256"]), name
              if "md5" in info:
                  assert re.fullmatch(r"[0-9a-f]{32}", info["md5"]), f"{name}: md5 is malformed"
          assert meta["files"][meta["assetDir"] + "liblouis.data"]["bytes"] == 13751594, "liblouis.data is not the intact size"
          print(f"dotpad sdk pin {meta['version']} @ {meta['commit'][:7]} ok")
          EOF

      - name: Version pins are consistent
        run: |
          python - <<'EOF'
          import json, re, pathlib
          ver = json.load(open("skills/maidr/assets/maidr-bundle.json"))["version"]
          bad = []
          for path in list(pathlib.Path("skills/maidr").rglob("*")) + [pathlib.Path("README.md")]:
              if path.is_dir() or path.suffix in {".css"} or path.name == "maidr.js":
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for m in re.finditer(r"maidr@(\d+\.\d+\.\d+)|/libs/maidr/(\d+\.\d+\.\d+)/|MAIDR_(?:JS_)?VERSION\s*=\s*\"(\d+\.\d+\.\d+)\"|maidr-js-version:\s*\"(\d+\.\d+\.\d+)\"", text):
                  found = next(g for g in m.groups() if g)
                  if found != ver:
                      bad.append(f"{path}: {m.group(0)}")
          if bad:
              print("\n".join(bad)); raise SystemExit("version pins disagree with maidr-bundle.json")
          print(f"all pins are {ver}")
          EOF
